<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body><script>
(function () {
  var params = new URLSearchParams(window.location.hash.slice(1));
  var frameId = params.get('frameId');
  var token = params.get('token');
  var source = 'capubbs-thread-html-frame';
  function receive(event) {
    var data = event.data;
    if (event.source !== window.parent || !data || data.source !== source
        || data.type !== 'document-response' || data.frameId !== frameId
        || data.token !== token || typeof data.html !== 'string') return;
    window.removeEventListener('message', receive);
    document.open();
    document.write(data.html);
    document.close();
  }
  window.addEventListener('message', receive);
  window.parent.postMessage({ source: source, type: 'document-request', frameId: frameId, token: token }, '*');
}());
</script></body></html>
