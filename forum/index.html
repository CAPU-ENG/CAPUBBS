      #forum-startup {
        --startup-page: #f3f5f1;
        --startup-text: #20231f;

        --startup-brand: #236b4c;

        inset: 0;

        --startup-page: #111613;

        --startup-line: #2c362f;
        --startup-brand: #69b98d;

      #forum-startup-status {
        position: relative;
        flex: 1;
        height: 1.5em;
        overflow: hidden;
        white-space: nowrap;
      }
      #forum-startup-status .startup-message-in {
        display: block;
        animation: forum-startup-message-in 0.3s ease-out both;
      }
      #forum-startup-status .startup-message-out {
        position: absolute;
        inset: 0;
        animation: forum-startup-message-out 0.3s ease-out both;
      }
      @keyframes forum-startup-message-in {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      @keyframes forum-startup-message-out {
        from { transform: translateY(0); }
        to { transform: translateY(-100%); }
      }
      #forum-startup-percent { flex-shrink: 0; font-variant-numeric: tabular-nums; }

        display: block;
        width: 100%;

        border-radius: 2px;

        background: var(--startup-line);
        accent-color: var(--startup-brand);
      }
      #forum-startup progress::-webkit-progress-bar { background: var(--startup-line); }
      #forum-startup progress::-webkit-progress-value { background: var(--startup-brand); }
      #forum-startup progress::-moz-progress-bar { background: var(--startup-brand); }
      #forum-startup-indeterminate {
        height: 4px;
        margin-top: 12px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--startup-line);
      }
      #forum-startup-indeterminate span {
        display: block;
        width: 30%;
        height: 100%;
        background: var(--startup-brand);
        animation: forum-startup-indeterminate 1.2s linear infinite;
      }
      @keyframes forum-startup-indeterminate {
        from { transform: translateX(-100%); }
        to { transform: translateX(334%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #forum-startup-status .startup-message-in { animation: none; }
        #forum-startup-status .startup-message-out { display: none; }
        #forum-startup-indeterminate span {
          width: 100%;
          opacity: 0.6;
          animation: none;
        }
      }
      #forum-startup-retry {
        margin-top: 20px;
        padding: 6px 14px;
        border: 1px solid var(--startup-brand);
        border-radius: 2px;
        color: var(--startup-brand);
        background: transparent;
        font: inherit;
        cursor: pointer;
      }
      #forum-startup [hidden] { display: none; }
      #forum-startup-bar { display: none; }
      #forum-startup[data-mode="bar"] .startup-content { display: none; }
      #forum-startup[data-mode="bar"] #forum-startup-bar {
        position: fixed;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 3px;

      }

        from { transform: scaleX(0.08); }
        to { transform: scaleX(0.9); }
